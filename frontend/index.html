
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Banking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Distributed Banking System</h1>
        <p>Secure Multi-Bank Transaction Management</p>
    </header>

    <main>
        <section class="summary">
            <h2>Total Banking Balance</h2>
            <h1 id="totalBalance">₹0</h1>
            <button onclick="loadBalances()">Refresh Balances</button>
        </section>

        <section>
            <h2>Bank Accounts</h2>
            <div id="accountCards" class="account-container"></div>
        </section>

        
       <section class="history-section">
    <h2>Transaction History</h2>

    <button onclick="loadTransactions()">Refresh History</button>

    <div id="transactionHistory">
        Loading transactions...
    </div>
</section>

            <form id="transferForm">
                <label>From Bank</label>
                <select id="fromBank" required>
                    <option value="Bank_A">Bank A</option>
                    <option value="Bank_B">Bank B</option>
                    <option value="Bank_C">Bank C</option>
                </select>

                <label>To Bank</label>
                <select id="toBank" required>
                    <option value="Bank_B">Bank B</option>
                    <option value="Bank_A">Bank A</option>
                    <option value="Bank_C">Bank C</option>
                </select>

                <label>Amount (₹)</label>
                <input type="number" id="amount" min="0.01" step="0.01" required>

                <button type="submit">Transfer Money</button>
            </form>

            <p id="message"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
